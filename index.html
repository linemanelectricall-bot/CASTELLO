<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castello Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<style>
body{background:#0F0F0F;color:white;font-family:sans-serif}
.gold{color:#C5A059}
.card{background:#1A1A1A;border:1px solid #2A2A2A}
.btn{background:linear-gradient(135deg,#C5A059,#8E6E37)}
</style>
</head>

<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 CONFIG */
const firebaseConfig={
apiKey:"ISI",
authDomain:"ISI",
projectId:"ISI"
};

const appFB=initializeApp(firebaseConfig);
const db=getFirestore(appFB);

/* STATE */
let mode="home",tab="makanan",cart=[],meja=null,page="pesanan";
let menus=[],orders=[];

/* REALTIME LISTENER */
onSnapshot(collection(db,"menu"),snap=>{
menus=snap.docs.map(d=>({id:d.id,...d.data()}));
render();
});

onSnapshot(collection(db,"orders"),snap=>{
orders=snap.docs.map(d=>({id:d.id,...d.data()}));
render();
});

/* ================= UI ================= */
function render(){
let app=document.getElementById("app");

/* HOME */
if(mode==="home"){
app.innerHTML=`
<div class="flex items-center justify-center h-screen text-center">
<div>
<h1 class="text-5xl gold mb-6">CASTELLO</h1>
<button onclick="mode='meja';render()" class="btn px-6 py-3 text-black rounded">ORDER</button>
<button onclick="mode='admin';render()" class="ml-3 bg-gray-800 px-6 py-3 rounded">ADMIN</button>
</div>
</div>`;
}

/* MEJA */
if(mode==="meja"){
app.innerHTML=`
<div class="p-6 text-center">
<h2 class="gold mb-4">Pilih Meja</h2>
<div class="grid grid-cols-3 gap-3">
${[1,2,3,4,5,6,7,8,9].map(n=>`
<button onclick="setMeja(${n})" class="bg-gray-800 py-5 rounded">Meja ${n}</button>`).join("")}
</div></div>`;
}

/* ORDER */
if(mode==="order"){
app.innerHTML=`
<div class="p-3 text-center border-b">
<h1 class="gold">CASTELLO</h1>
<p class="text-xs">Meja ${meja}</p>
</div>

<div class="grid grid-cols-2 gap-3 p-3">
${menus.map(m=>`
<div class="card rounded">
<img src="${m.img}" class="h-24 w-full object-cover">
<div class="p-2 text-center">
<p>${m.nama}</p>
<p class="gold">Rp ${m.harga}</p>
<button onclick="add('${m.id}','${m.nama}',${m.harga})"
class="border px-2 text-xs">Tambah</button>
</div>
</div>`).join("")||"<p class='col-span-2 text-center'>Menu kosong</p>"}
</div>

${cart.length?`
<div class="fixed bottom-0 w-full bg-black p-3 flex justify-between">
<span>Rp ${total()}</span>
<button onclick="mode='checkout';render()" class="btn px-3 text-black">Checkout</button>
</div>`:""}
`;
}

/* CHECKOUT */
if(mode==="checkout"){
app.innerHTML=`
<div class="p-4">
<h2 class="gold mb-3">Checkout</h2>

${cart.map(i=>`
<div class="flex justify-between">
<span>${i.nama} x${i.qty}</span>
<span>${i.qty*i.harga}</span>
</div>`).join("")}

<p class="gold mt-3">Total Rp ${total()}</p>

<button onclick="bayar()" class="btn w-full py-2 mt-3 text-black">Bayar</button>
</div>`;
}

/* STRUK (kecil) */
if(mode==="struk"){
app.innerHTML=`
<div class="flex justify-center items-center h-screen">
<div class="bg-white text-black p-4 w-64 text-xs">
<h2 class="text-center font-bold">CASTELLO</h2>
<p>Kode: ${last.kode}</p>
<p>${last.tgl}</p>
<hr>
${last.items.map(i=>`
<div class="flex justify-between">
<span>${i.nama}x${i.qty}</span>
<span>${i.total}</span>
</div>`).join("")}
<hr>
<p>Total: ${last.total}</p>

<p class="text-center mt-2">📸 Foto bukti pembayaran</p>

<button onclick="mode='order';render()" class="w-full mt-2 border">Kembali</button>
</div>
</div>`;
}

/* ADMIN */
if(mode==="admin"){
app.innerHTML=`
<div class="flex min-h-screen">

<div class="w-48 bg-black p-3 space-y-2">
<button onclick="page='pesanan';render()">Pesanan</button>
<button onclick="page='menu';render()">Menu</button>
<button onclick="page='back';mode='home';render()">⬅ Kembali</button>
</div>

<div class="flex-1 p-4">
${adminView()}
</div>

</div>`;
}

}

/* ================= ADMIN ================= */
function adminView(){

if(page==="pesanan"){
return orders.map(o=>`
<div class="card p-2 mb-2">
<p>Meja ${o.meja}</p>
<p>Rp ${o.total}</p>
</div>`).join("")||"Kosong";
}

/* MENU */
if(page==="menu"){
return `
<h2 class="gold mb-2">Tambah Menu</h2>

<input id="nama" placeholder="Nama" class="p-2 bg-black border w-full mb-2">
<input id="harga" placeholder="Harga" class="p-2 bg-black border w-full mb-2">
<input id="img" type="file" class="mb-2">

<button onclick="addMenu()" class="btn px-3 text-black">Tambah</button>

<h3 class="gold mt-4">List</h3>

${menus.map(m=>`
<div class="flex justify-between border-b py-1">
<span>${m.nama}</span>
<div>
<input value="${m.harga}" onchange="edit('${m.id}',this.value)" class="w-16 bg-black border">
<button onclick="hapus('${m.id}')" class="text-red-400 ml-2">X</button>
</div>
</div>`).join("")}
`;
}

}

/* ================= LOGIC ================= */
function setMeja(n){meja=n;mode="order";render();}

function add(id,nama,harga){
let f=cart.find(i=>i.id===id);
f?f.qty++:cart.push({id,nama,harga,qty:1});
render();
}

function total(){
return cart.reduce((a,b)=>a+(b.qty*b.harga),0);
}

/* BAYAR REALTIME */
let last=null;
async function bayar(){
let kode="TRX"+Date.now();
let tgl=new Date().toLocaleString();

last={
kode,tgl,total:total(),
items:cart.map(i=>({...i,total:i.qty*i.harga}))
};

await addDoc(collection(db,"orders"),{
meja,total:total(),time:Date.now()
});

cart=[];
mode="struk";
render();
}

/* ADMIN FIREBASE */
async function addMenu(){
let nama=document.getElementById("nama").value;
let harga=+document.getElementById("harga").value;
let file=document.getElementById("img").files[0];

let reader=new FileReader();
reader.onload=async e=>{
await addDoc(collection(db,"menu"),{
nama,harga,img:e.target.result
});
};
if(file) reader.readAsDataURL(file);
}

async function hapus(id){
await deleteDoc(doc(db,"menu",id));
}

async function edit(id,val){
await updateDoc(doc(db,"menu",id),{harga:+val});
}

/* INIT */
window.onload=render;
</script>

</body>
</html>
