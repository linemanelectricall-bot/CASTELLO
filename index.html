<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castello Resto</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0F0F0F; color:white; }
.gold { color:#C5A059; }
.btn-gold { background: linear-gradient(135deg, #C5A059, #8E6E37); }
.card { background:#1A1A1A; border:1px solid #2A2A2A; }
</style>
</head>

<body>

<div id="app"></div>

<script>
let mode = "home";
let tab = "makanan";
let cart = [];
let tapCount = 0;
let meja = null;

/* ADMIN */
let passwordAdmin = "12345";
let adminPage = "pesanan";

/* DATABASE SIMULASI */
let orders = [];
let transaksi = [];

/* MENU */
const menuMakanan = [
 {id:1,nama:"Nasi Goreng",harga:20000,img:"https://source.unsplash.com/300x200/?fried-rice"},
 {id:2,nama:"Ayam Bakar",harga:25000,img:"https://source.unsplash.com/300x200/?grilled-chicken"}
];

const menuMinuman = [
 {id:3,nama:"Es Teh",harga:10000,img:"https://source.unsplash.com/300x200/?tea"},
 {id:4,nama:"Jus Mangga",harga:15000,img:"https://source.unsplash.com/300x200/?juice"}
];

/* ================= RENDER ================= */
function render(){
const app = document.getElementById("app");
if(!app) return;

/* HOME */
if(mode==="home"){
app.innerHTML = `
<div class="flex items-center justify-center min-h-screen text-center">
<div>
<h1 class="text-5xl gold mb-6">CASTELLO</h1>

<button onclick="pilihMeja()" class="block w-64 py-4 mb-3 btn-gold text-black font-bold">
MODE ORDER
</button>

<button onclick="mode='login';render()" class="block w-64 py-4 bg-gray-800 font-bold">
MODE ADMIN
</button>
</div>
</div>`;
}

/* LOGIN */
if(mode==="login"){
app.innerHTML = `
<div class="flex items-center justify-center min-h-screen">
<div class="card p-6 w-80 text-center">
<h2 class="gold mb-4">Login Admin</h2>

<input id="pass" type="password" placeholder="Password"
class="w-full p-2 mb-3 bg-black border">

<button onclick="login()" class="w-full py-2 btn-gold text-black">
Masuk
</button>

<button onclick="mode='home';render()" class="mt-3 text-sm">
Kembali
</button>
</div>
</div>`;
}

/* ADMIN DASHBOARD */
if(mode==="admin"){
app.innerHTML = `
<div class="flex min-h-screen">

<div class="w-48 bg-black border-r border-gray-800 p-3 space-y-2">
<button onclick="adminPage='pesanan';render()">Pesanan</button>
<button onclick="adminPage='analisis';render()">Analisis</button>
<button onclick="adminPage='keuangan';render()">Keuangan</button>
<button onclick="adminPage='menu';render()">Menu</button>
<button onclick="adminPage='password';render()">Password</button>
<button onclick="logout()" class="text-red-400">Logout</button>
</div>

<div class="flex-1 p-4">
${adminContent()}
</div>

</div>`;
}

/* PILIH MEJA */
if(mode==="meja"){
app.innerHTML = `
<div class="p-6 text-center">
<h2 class="gold text-xl mb-4">Pilih Meja</h2>
<div class="grid grid-cols-3 gap-3">
${[1,2,3,4,5,6,7,8,9].map(n=>`
<button onclick="setMeja(${n})" class="bg-gray-800 py-4 rounded">
Meja ${n}
</button>`).join("")}
</div>
</div>`;
}

/* ORDER */
if(mode==="order"){
let menu = tab==="makanan"?menuMakanan:menuMinuman;

app.innerHTML = `
<header class="p-4 text-center relative">
<h1 class="gold">CASTELLO</h1>
<p class="text-xs">Meja ${meja}</p>

<div onclick="secretTap()" class="absolute top-0 right-0 w-16 h-16 opacity-0"></div>
</header>

<div class="flex">
<button onclick="tab='makanan';render()" class="flex-1 p-2 ${tab==="makanan"?"gold":""}">
Makanan</button>
<button onclick="tab='minuman';render()" class="flex-1 p-2 ${tab==="minuman"?"gold":""}">
Minuman</button>
</div>

<div class="grid grid-cols-2 gap-3 p-3">
${menu.map(m=>`
<div class="card">
<img src="${m.img}" class="h-24 w-full object-cover">
<div class="p-2 text-center">
<p>${m.nama}</p>
<p class="gold">Rp ${m.harga}</p>
<button onclick="add(${m.id})" class="text-xs border px-2">Tambah</button>
</div>
</div>`).join("")}
</div>

${cart.length>0?`
<div class="fixed bottom-0 w-full bg-black p-3 flex justify-between">
<span>Rp ${total()}</span>
<button onclick="mode='checkout';render()" class="bg-yellow-500 px-4 text-black">
Checkout
</button>
</div>`:""}
`;
}

/* CHECKOUT */
if(mode==="checkout"){
app.innerHTML = `
<div class="p-4">
<h2 class="gold">Pesanan Meja ${meja}</h2>

${cart.map(i=>`
<div class="flex justify-between">
<span>${i.nama} x${i.qty}</span>
<span>Rp ${i.qty*i.harga}</span>
</div>`).join("")}

<p class="mt-3 gold">Total: Rp ${total()}</p>

<button onclick="bayar()" class="w-full py-3 btn-gold text-black mt-4">
Bayar
</button>
</div>`;
}

}

/* ADMIN CONTENT */
function adminContent(){

if(adminPage==="pesanan"){
return `
<h2 class="gold mb-4">Pesanan</h2>
${orders.map((o,i)=>`
<div class="card p-2 mb-2">
<p>Meja ${o.meja}</p>
<p>Rp ${o.total}</p>
<button onclick="done(${i})" class="bg-green-500 px-2">Done</button>
</div>`).join("")}
`;
}

if(adminPage==="analisis"){
return `
<h2 class="gold">Analisis</h2>
<p>Total Order: ${orders.length}</p>
<p>Total Transaksi: ${transaksi.length}</p>
`;
}

if(adminPage==="keuangan"){
return `
<h2 class="gold">Keuangan</h2>
${transaksi.map(t=>`
<div class="flex justify-between">
<span>Meja ${t.meja}</span>
<span>Rp ${t.total}</span>
</div>`).join("")}
<p class="gold mt-2">
Total: Rp ${transaksi.reduce((a,b)=>a+b.total,0)}
</p>
`;
}

if(adminPage==="menu"){
return `<h2 class="gold">Menu (Coming Soon)</h2>`;
}

if(adminPage==="password"){
return `
<h2 class="gold">Ganti Password</h2>
<input id="newpass" class="p-2 bg-black border">
<button onclick="gantiPassword()" class="btn-gold px-3 text-black mt-2">
Simpan
</button>`;
}

}

/* ACTION */
function login(){
let p = document.getElementById("pass").value;
if(p===passwordAdmin){mode="admin";render();}
else{alert("Password salah")}
}

function logout(){mode="home";render();}

function pilihMeja(){mode="meja";render();}
function setMeja(n){meja=n;mode="order";render();}

function add(id){
let item=[...menuMakanan,...menuMinuman].find(i=>i.id===id);
let f=cart.find(i=>i.id===id);
if(f){f.qty++}else{cart.push({...item,qty:1})}
render();
}

function total(){
return cart.reduce((a,b)=>a+(b.qty*b.harga),0);
}

function bayar(){
orders.push({meja,total:total()});
transaksi.push({meja,total:total()});
cart=[];
mode="order";
render();
alert("Pesanan dikirim ke dapur!");
}

function done(i){
orders.splice(i,1);
render();
}

function gantiPassword(){
passwordAdmin=document.getElementById("newpass").value;
alert("Password diganti");
}

/* SECRET TAP */
function secretTap(){
tapCount++;
if(tapCount>=3){
mode="login";
render();
tapCount=0;
}
setTimeout(()=>tapCount=0,2000);
}

/* INIT FIX (ANTI ERROR) */
window.onload = () => {
render();
};
</script>

</body>
</html>
