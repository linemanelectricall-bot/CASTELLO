<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resto Premium Final</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
margin:0;
color:#fff;
background:
linear-gradient(rgba(10,10,10,0.9),rgba(10,10,10,0.95)),
url('https://i.imgur.com/8Km9tLL.png');
background-size:cover;
}

h1,h2{color:#d4af37;text-align:center}

.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(212,175,55,0.3);
border-radius:15px;
}

button{
background:linear-gradient(45deg,#d4af37,#f7e7a0);
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{padding:15px;text-align:center}

.cart{
position:fixed;
right:15px;
bottom:15px;
width:220px;
padding:15px;
}

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:200px;
padding:20px;
}
.sidebar button{width:100%;margin-bottom:10px;}

.main{margin-left:220px;padding:20px;}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:15px;
border-radius:10px;
border:1px solid #d4af37;
opacity:0;
transition:0.5s;
}
.toast.show{opacity:1;}

.hidden{display:none}
</style>
</head>

<body>

<h1>RESTORAN PREMIUM</h1>

<!-- HOME -->
<div id="home" class="grid">
<div class="glass card">
<h2>ORDER</h2>
<button onclick="openOrder()">Masuk</button>
</div>

<div class="glass card">
<h2>ADMIN</h2>
<button onclick="openLogin()">Login</button>
</div>
</div>

<!-- ORDER -->
<div id="order" class="hidden">
<h2>MENU</h2>
<div id="menuList" class="grid"></div>

<div class="cart glass">
<h3>Keranjang</h3>
<div id="cartList"></div>
<button onclick="checkout()">Checkout</button>
</div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden" style="max-width:300px;margin:50px auto;">
<div class="glass card">
<h2>Login</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Masuk</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<div class="sidebar glass">
<button onclick="showPage('pesanan')">Pesanan</button>
<button onclick="showPage('menu')">Menu</button>
<button onclick="showPage('password')">Keamanan</button>
</div>

<div class="main">

<div id="pesanan">
<h2>LIVE ORDER</h2>
<div id="orderList"></div>
</div>

<div id="menu" class="hidden">
<h2>Manajemen Menu</h2>
<input id="namaMenu" placeholder="Nama">
<input id="hargaMenu" placeholder="Harga">
<button onclick="addMenu()">Tambah</button>
<div id="listMenuAdmin"></div>
</div>

<div id="password" class="hidden">
<h2>Ganti Password</h2>
<input id="oldPass" placeholder="Lama">
<input id="newPass" placeholder="Baru">
<button onclick="changePass()">Simpan</button>
</div>

</div>
</div>

<div id="toast" class="toast"></div>

<!-- FIREBASE COMPAT -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>

/* 🔥 ISI CONFIG KAMU */
const firebaseConfig = {
apiKey: "ISI",
authDomain: "ISI",
databaseURL: "ISI",
projectId: "ISI",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* DATA */
let menu = [
{nama:"Nasi Goreng", harga:50000},
{nama:"Ayam Bakar", harga:45000},
{nama:"Es Teh", harga:10000}
];

let cart=[];

/* NAV */
function openOrder(){
home.classList.add("hidden");
order.classList.remove("hidden");
renderMenu();
}

function openLogin(){
home.classList.add("hidden");
login.classList.remove("hidden");
}

/* MENU */
function renderMenu(){
menuList.innerHTML = menu.map((m,i)=>`
<div class="glass card">
<h3>${m.nama}</h3>
<p>Rp ${m.harga}</p>
<button onclick="addCart(${i})">Tambah</button>
</div>`).join("");
}

function addCart(i){
cart.push(menu[i]);
cartList.innerHTML = cart.map(c=>`<p>${c.nama}</p>`).join("");
}

/* CHECKOUT REALTIME */
function checkout(){
let total = cart.reduce((a,b)=>a+b.harga,0);

firebase.database().ref("orders").push({
meja:"05",
items:cart,
total:total,
status:"baru",
time:Date.now()
});

cart=[];
cartList.innerHTML="";
showToast("Pesanan dikirim 🔥");
}

/* LOGIN */
function login(){
if(pass.value==="admin123"){
login.classList.add("hidden");
admin.classList.remove("hidden");
}else alert("Password salah");
}

/* REALTIME ADMIN */
firebase.database().ref("orders").on("value",(snap)=>{
let data = snap.val();
let html="";

if(data){
for(let id in data){
let o = data[id];
html+=`
<div class="glass card">
Meja ${o.meja} - Rp ${o.total}
<br>Status: ${o.status}
<button onclick="done('${id}')">DONE</button>
</div>`;
}
}

orderList.innerHTML = html;
});

/* DONE */
function done(id){
firebase.database().ref("orders/"+id).remove();
}

/* ADMIN MENU */
function addMenu(){
menu.push({
nama:namaMenu.value,
harga:Number(hargaMenu.value)
});
renderMenuAdmin();
}

function renderMenuAdmin(){
listMenuAdmin.innerHTML = menu.map((m,i)=>`
<div class="glass card">
${m.nama} - ${m.harga}
<button onclick="hapus(${i})">Hapus</button>
</div>`).join("");
}

function hapus(i){
menu.splice(i,1);
renderMenuAdmin();
}

/* PASSWORD */
function changePass(){
alert("Fitur demo (butuh database auth)");
}

/* NAV ADMIN */
function showPage(p){
["pesanan","menu","password"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});
document.getElementById(p).classList.remove("hidden");
}

/* TOAST */
function showToast(msg){
toast.innerText=msg;
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),2000);
}

</script>

</body>
</html>
